name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows-relwithdebinfo

      # The same gate the pull-request workflow runs: a tag should not ship
      # something that was never tested.
      - name: Test
        run: ctest --preset ci-windows-relwithdebinfo --label-exclude gpu --output-on-failure

      # The executable needs its compiled shaders and the Agility SDK and WARP
      # staged beside it, which the build already does.
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/ci-windows/bin/RelWithDebInfo/. dist/
          cp LICENSE README.md dist/

      - name: Archive
        shell: bash
        run: |
          name="radiance4d-${GITHUB_REF_NAME:-dev}-windows-x64"
          7z a "$name.zip" ./dist/*
          echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
