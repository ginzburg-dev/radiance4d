name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and first: an unformatted tree fails before a runner spends ten
  # minutes building it.
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        shell: bash
        run: |
          fail=0
          sources=$(git ls-files 'include/*.hpp' 'src/*.cpp' 'src/*.hpp' 'app/*.cpp' 'app/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
          for f in $sources; do
            clang-format "$f" | diff -q - "$f" >/dev/null || { echo "unformatted: $f"; fail=1; }
          done
          exit $fail

  build-and-test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, relwithdebinfo]

    steps:
      - uses: actions/checkout@v4

      # The ci-windows preset pins neither the Visual Studio version nor the
      # Windows SDK, so it follows whatever the runner image provides.
      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows-${{ matrix.configuration }}

      # No discrete GPU on a hosted runner: the device tests use the pinned WARP
      # staged next to the test binaries.
      - name: Test
        run: ctest --preset ci-windows-${{ matrix.configuration }} --label-exclude gpu --output-on-failure

      - name: Upload image-regression artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-diff-${{ matrix.configuration }}
          path: |
            tests/data/references/**/*.actual.png
            tests/data/references/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 7
