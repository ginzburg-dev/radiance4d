name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, RelWithDebInfo]

    steps:
      - uses: actions/checkout@v4

      # Dependencies are downloaded by CMake and pinned by SHA-256, so caching
      # them is safe: a changed hash changes the key.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/windows-d3d12/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Fetch*.cmake', 'CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake --preset windows-d3d12

      - name: Build
        run: cmake --build --preset windows-d3d12-${{ matrix.configuration == 'Debug' && 'debug' || 'relwithdebinfo' }}

      # Hosted runners have no discrete GPU. Every test here either touches no
      # device at all or uses the PINNED WARP redistributable that CMake stages
      # next to the test binaries, which is the same rasteriser used locally --
      # that is what makes the image references comparable across machines.
      #
      # A future GPU-only suite is excluded with -LE gpu; nothing carries that
      # label yet, so this currently runs everything.
      - name: Test
        run: ctest --preset windows-d3d12-${{ matrix.configuration == 'Debug' && 'debug' || 'relwithdebinfo' }} --label-exclude gpu --output-on-failure

      # Image-regression failures write .actual.png and .diff.png beside the
      # reference. Without these artefacts a CI image failure is unreadable.
      - name: Upload image-regression artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-diff-${{ matrix.configuration }}
          path: |
            tests/data/references/**/*.actual.png
            tests/data/references/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 7
